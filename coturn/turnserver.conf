# Coturn TURN Server Configuration for Multi-Slot WebRTC
# Listening Ports
listening-port=3478
tls-listening-port=5349

# Ephemeral Time-Limited Credentials using shared auth secret
use-auth-secret
static-auth-secret=your_weechat_auth_secret_key_12345
realm=weechat.local

# Limited Relay Port Range for WebRTC P2P Mesh (as requested)
min-port=49152
max-port=49252

# Security & Fingerprinting
fingerprint
lt-cred-mech
stale-nonce=600

# Performance & Logging
total-quota=100
bps-capacity=0
no-stdout-log
log-file=/var/log/turnserver.log
